name: Craftsman Quality Gate

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the gate reads the code and, on a pull request, writes a
# review comment. Without this block the workflow inherits the repository
# default, which on older repositories is still read/write on everything.
permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      # Full history, because a pull request is validated against its base:
      # `--changed-only` diffs the branch against the merge base, and a shallow
      # checkout has no merge base to diff against.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup PHP (if composer.json exists)
        if: ${{ hashFiles('composer.json') != '' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer, phpstan

      - name: Setup Node.js (if package.json exists)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        if: ${{ hashFiles('composer.json') != '' }}
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node.js dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Run craftsman-ci quality gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          # On a pull request only the files that differ from the base branch
          # are validated. Measured before this: 0.42s a file, so a one-file
          # pull request on a 3000-file repository paid 22 minutes and reported
          # every pre-existing finding, which is how a gate ends up on
          # allow_failure. A push to main still scans everything.
          CRAFTSMAN_SCOPE: ${{ github.event_name == 'pull_request' && '--changed-only' || '' }}
        run: |
          chmod +x ci/craftsman-ci.sh
          bash ci/craftsman-ci.sh ci --provider github $CRAFTSMAN_SCOPE
