# Russian seed lexicon (ADR-0030). Mode signal: recall-oriented. Cyrillic case
# variants are explicit because grep -i folding is locale-dependent.
BIAS_REGISTERED_LANGS+=("ru")
BIAS_RU_MODE="signal"
BIAS_RU_ACCELERATION="(быстро|Быстро) (сделай|давай)|сделай .{0,15}быстро|(давай|Давай) быстрее|нет времени|без (тестов|раздумий|дизайна)|(сразу|Сразу) код"
BIAS_RU_SCOPE_CREEP="(и|И) (ещё|еще|также) добавь|заодно (добавь|сделай)|раз уж"
BIAS_RU_OVER_OPT="(абстрагируй|Абстрагируй)|(обобщи|Обобщи)|сделай (настраиваем|универсальн|расширяем)|на будущее"
BIAS_RU_DOMAIN_MODELING="(создай|Создай) (сущность|агрегат|объект[- ]значение|доменное событие)"
