name: react
version: "1.0.0"
description: "React/TypeScript craftsman pack - React 19, TanStack Query, Tailwind, shadcn/ui"
compatibility:
  core: ">=2.4.0"
  stack: ["react", "fullstack"]

languages:
  - id: typescript
    extensions: [ts, tsx]
    entry_markers: [package.json, tsconfig.json]
    protected_configs: [".eslintrc", ".eslintrc.json", ".eslintrc.js", ".eslintrc.cjs", ".eslintrc.yml", ".eslintrc.yaml", "eslint.config.js", "eslint.config.mjs", "eslint.config.cjs", "eslint.config.ts", ".dependency-cruiser.js", ".dependency-cruiser.json", ".dependency-cruiser.cjs", "dependency-cruiser.config.js"]
    validators: ["hooks/typescript-validator.sh", "hooks/layer-validator.sh", "hooks/persistence-validator.sh", "hooks/security-validator.sh"]
    static_analysis: ["static-analysis/eslint.sh"]
    test_commands: ["jest", "vitest", "npm test", "pnpm test", "yarn test"]
    lsp: "typescript-language-server"
    metrics_dialect: c-like
  # JavaScript is claimed so custom rules scoped to it still resolve, but it
  # declares no validator and no static analysis: the pack's doctrine is
  # TypeScript, and silently running TS rules on .js would be a scope change.
  - id: javascript
    extensions: [js, jsx]
    metrics_dialect: c-like

rules:
  # Rules this pack owns: the wording and the default severity that the
  # exported doctrine and the rules engine both read from here.
  owned:
    - id: TS001
      group: TypeScript
      text: "no any - use a precise type or unknown"
      default_severity: block
    - id: TS002
      group: TypeScript
      text: "no default export - use named exports"
      default_severity: warn
    - id: TS003
      group: TypeScript
      text: "no non-null assertion (!) - handle null explicitly"
      default_severity: warn
    - id: WARN-TS001
      group: Advisory
      text: "four or more parameters - consider an object"
      default_severity: warn
  builtin: ["TS001", "TS002", "TS003", "WARN-TS001", "LAYER001", "NEST001", "LOC001", "GOD001", "PARAM001"]
  static_analysis: ["ESLINT001", "ESLINT002", "ESLINT003", "ESLINT004"]

hooks:
  validators: ["hooks/typescript-validator.sh", "hooks/layer-validator.sh", "hooks/persistence-validator.sh", "hooks/security-validator.sh"]

static_analysis:
  tools: ["static-analysis/eslint.sh"]

commands:
  scaffold_types: ["component", "hook"]

agents: ["agents/frontend-craftsman.md", "agents/react-reviewer.md"]

knowledge: ["knowledge/"]

templates: ["templates/"]

# Command suggestions this pack contributes to the routing table.
routes:
  - trigger: "Scaffold React component, hook, branded type"
    command: "/craftsman:scaffold"
