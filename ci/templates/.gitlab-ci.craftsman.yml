# =============================================================================
# Craftsman Quality Gate - GitLab CI template
#
# Include in your .gitlab-ci.yml:
#   include: '.gitlab-ci.craftsman.yml'
#
# Required variables (set in CI/CD settings or pass via pipeline):
#   GITLAB_TOKEN  - project access token or PAT, for the MR comment only.
#                   CI_JOB_TOKEN does NOT work: GitLab grants it read-only
#                   access to the notes API, so posting a note with it can only
#                   fail. The quality gate itself needs no token; without one
#                   you get the verdict and the exit code, just no MR comment.
# =============================================================================

craftsman-quality-gate:
  stage: test
  image: python:3.12-slim
  variables:
    CRAFTSMAN_PATH: "ci/craftsman-ci.sh"
    # Full history: `--changed-only` diffs a merge request against its target
    # branch, and GitLab's default shallow clone has nothing to diff against.
    GIT_DEPTH: 0
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - chmod +x "$CRAFTSMAN_PATH"
    # A merge request validates only the files it changes; the default branch
    # still scans everything. See --changed-only in the craftsman-ci usage.
    - if [ -n "$CI_MERGE_REQUEST_IID" ]; then git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"; SCOPE="--changed-only"; else SCOPE=""; fi
    - bash "$CRAFTSMAN_PATH" ci --provider gitlab $SCOPE
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    when: always
  allow_failure:
    exit_codes:
      - 1
