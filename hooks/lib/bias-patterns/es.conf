# Spanish bias patterns (ADR-0030). Mode signal: like every language except the
# model's own English, a hit here becomes a note the main model adjudicates.
# Patterns authored in PR #11 by floze-the-genius, recycled onto the registry.
# Case variants are explicit because signal matching is case-sensitive: grep -i
# folding is locale-dependent beyond ASCII, so it cannot be trusted here.
BIAS_REGISTERED_LANGS+=("es")
BIAS_ES_MODE="signal"
BIAS_ES_ACCELERATION="[Hh]azlo (ya|ahora|rápido)|[Nn]o hay tiempo|[Oo]mite (el )?(diseño|test|pruebas|revisión)|([Hh]azlo|[Pp]rograma|[Ii]mplementa) sin (pensar|probar|diseñar)"
BIAS_ES_SCOPE_CREEP="[Yy] (también|además) (añade|agrega|implementa|cambia|haz)|[Yy]a que estamos.*(añade|agrega|implementa|cambia|haz)|[Aa]grega también"
BIAS_ES_OVER_OPT="([Aa]bstrae|[Gg]eneraliza) (esto|este|esta|el|la)|[Vv]amos a (abstraer|generalizar)|[Hh]azlo (abstracto|configurable|genérico|extensible)"
BIAS_ES_DOMAIN_MODELING="[Cc]rea (una |un |la |el )?(entidad|objeto de valor|agregado|evento de dominio|servicio de dominio)"
