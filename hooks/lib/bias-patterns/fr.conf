# French bias patterns (ADR-0030). Mode signal: like every language except the
# model's own English, a hit here becomes a note the main model adjudicates.
# Case variants are explicit because signal matching is case-sensitive: grep -i
# folding is locale-dependent beyond ASCII, so it cannot be trusted here.
BIAS_REGISTERED_LANGS+=("fr")
BIAS_FR_MODE="signal"
# Mesuré contre un corpus indépendant, pas deviné : "on saute les tests pour
# cette fois" et "fais-le maintenant, on verra après" passaient tous les deux.
BIAS_FR_ACCELERATION="[Ff]ais.{0,10}vite|[Cc]ode direct|[Pp]as le temps|[Jj]uste code|[Ss]ans (réfléchir|tester|design)|[Oo]n saute (les |le |la )?(tests?|revue|design|étape)|[Ss]aute[rz]? (les |le )?(tests?|design)|[Oo]n verra (après|plus tard|ensuite|demain)|[Ff]ais[- ]le maintenant"
# La virgule après "et aussi" cassait le motif : "et aussi, ajoute un cache"
# est la forme la plus naturelle en français et elle n'était pas vue.
BIAS_FR_SCOPE_CREEP="[Ee]t (aussi|en plus),? *(ajoute|fais|met|ajoutons)|[Tt]ant qu'on y est|[Aa]joutons aussi|[Rr]ajoute|[Pp]rofites?-en pour"
BIAS_FR_OVER_OPT="[Aa]bstraire|[Gg]énéraliser|[Pp]our (le futur|plus tard)|[Rr]ends[- ]?(le )?(configurable|générique|abstrait)"
# Discours rapporté, même raison qu'en anglais : "le ticket dit qu'on saute les
# tests, c'est raisonnable ?" cite une instruction, il ne la donne pas.
BIAS_FR_REPORTED="[Dd]it qu|[Dd]isait|[Dd]emande de|[Rr]ecommande|[Ss]uggère|[Ss]ignale|[Ss]elon |[Cc]'est raisonnable|[Pp]ourquoi le |[Pp]ourquoi est-ce|[Ll]'an dernier|[Aa]-t-on raison"
BIAS_FR_DOMAIN_MODELING="[Cc]rée (une |un |l'?)?(entité|value object|agrégat|événement de domaine)"
# Lu par test-dismissal-guard.sh dans le dernier message du tour, seulement
# tant qu'un run de tests rouge n'a pas été suivi d'un run vert aussi large
# (CR-289) : « flaky, déjà connu, vert en isolation ».
BIAS_FR_TEST_DISMISSAL="[Ff]laky|[Ii]nstable|[Ii]ntermittent|[Aa]léatoire|[Dd]éjà connu|(problème|échec|test|bug) connu|[Pp]ré-?existant|[Pp]as (le mien|les miens|la mienne|les miennes|de mon fait)|[Pp]as liée? (à|a) (mon|ma|mes|ce|cette|ces) (changement|modification|diff)|[Ss]ans rapport avec (mon|ma|mes|ce|cette|ces)|(vert|passe|réussit) (seul|tout seul|en isolation|isolément|en local)|[Pp]roblème d'environnement"
