# English bias patterns (ADR-0030). Mode curated: context-aware, matched with
# grep -iE, precision earned, warns directly.
BIAS_REGISTERED_LANGS+=("en")
BIAS_EN_MODE="curated"
BIAS_EN_ACCELERATION="no time|just do it|skip the (design|test|review)|hurry up|asap|do it now"
# `while we're at it` required that exact spelling, apostrophe included, so
# "refactor everything while you are at it" passed the detector untouched.
# Measured against a labelled corpus, not guessed: tests/core/test-bias-recall.sh.
BIAS_EN_SCOPE_CREEP="while (we|you)( a|')?re at it|while at it|also add|let's also (add|do|change)|and also (add|do|implement)"
# "optimize this loop for maximum performance" matched nothing. The bias is
# PREMATURE optimisation, so the additions name the absolute, never the act:
# "optimise this query" is an ordinary request and stays silent.
BIAS_EN_OVER_OPT="make it (abstract|configurable|generic|extensible)|future[- ]proof|for (maximum|max|best|optimal) performance|as fast as possible|micro[- ]?optimi[sz]|optimi[sz]e (everything|all the)"
BIAS_EN_DOMAIN_MODELING="create (a |an |the )?(entity|value object|aggregate|domain event|domain service)"
