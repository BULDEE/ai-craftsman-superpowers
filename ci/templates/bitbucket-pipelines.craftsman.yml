# =============================================================================
# Craftsman Quality Gate - Bitbucket Pipelines template
#
# If you already have bitbucket-pipelines.yml, merge this step into your
# existing pipeline definition.
#
# Variables (Repository settings > Pipelines > Variables):
#   BITBUCKET_TOKEN  - OPTIONAL, and only for the PR comment. Code Insights
#                      needs no credentials inside Pipelines: the adapter goes
#                      through the documented proxy on localhost:29418, which
#                      adds the auth header itself. If you do set it, it must be
#                      a Bearer-capable token (an app password is Basic auth and
#                      will not authenticate).
# =============================================================================

pipelines:
  pull-requests:
    '**':
      - step:
          name: Craftsman Quality Gate
          image: python:3.12-slim
          caches:
            - composer
            - node
          script:
            - apt-get update -qq && apt-get install -qq -y nodejs npm jq
            - if [ -f "composer.json" ]; then composer install --no-interaction --prefer-dist; fi
            - if [ -f "package.json" ]; then npm ci; fi
            - chmod +x ci/craftsman-ci.sh
            - bash ci/craftsman-ci.sh ci --provider bitbucket

  branches:
    main:
      - step:
          name: Craftsman Quality Gate
          image: python:3.12-slim
          caches:
            - composer
            - node
          script:
            - apt-get update -qq && apt-get install -qq -y nodejs npm jq
            - if [ -f "composer.json" ]; then composer install --no-interaction --prefer-dist; fi
            - if [ -f "package.json" ]; then npm ci; fi
            - chmod +x ci/craftsman-ci.sh
            - bash ci/craftsman-ci.sh ci --provider bitbucket
