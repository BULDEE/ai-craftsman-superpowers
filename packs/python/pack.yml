name: python
version: "1.0.0"
description: "Python craftsman pack - Clean Code, type hints, pytest, architectural patterns"
compatibility:
  core: ">=3.1.0"
  stack: ["python", "ai-ml", "fullstack"]

languages:
  - id: python
    extensions: [py]
    entry_markers: [pyproject.toml, setup.py, requirements.txt]
    # Not pyproject.toml or setup.cfg: they carry dependencies and packaging
    # metadata as well as tool settings, so blocking them wholesale would stop
    # ordinary work to guard a quality gate. Only files that exist solely to
    # configure a gate belong here.
    protected_configs: ["mypy.ini", ".flake8"]
    validators: ["hooks/python-validator.sh"]
    test_commands: ["pytest", "python -m pytest", "tox"]
    lsp: "pyright-langserver"
    # No metrics_dialect: the engine extracts structural metrics from
    # brace-delimited sources only (c-like, php-like). Measuring an
    # indentation-based language with a brace scanner reports zero nesting
    # everywhere, and the ratchet would then guard a signal that is silently
    # absent. NEST001 and GOD001 come from this pack's own validator instead.

rules:
  # Rules this pack owns: the wording and the default severity that the
  # exported doctrine and the rules engine both read from here.
  #
  # `decision:` is the adjudication a rule received when its ignore rate was
  # measured (issue #31). It records the verdict and the reason so the next
  # maintainer does not relitigate it, and it names the paths where the rule is
  # structurally wrong WITHOUT hardcoding them here: a framework-specific
  # exclusion baked into pack data is the same mistake as a language list baked
  # into a hook. The relaxation belongs in the consuming project's
  # .craft-rules.yml. The registry does not read this key, a human does.
  owned:
    - id: PY001
      group: Python
      text: "no one or two character names - use descriptive ones"
      default_severity: block
    - id: PY002
      group: Python
      text: "a function past 30 lines is extracted"
      default_severity: block
      decision: "scoped - 96 of the 99 suppressions came from two throwaway generator scripts and the rate outside them is 5.6 percent, level with PY001, so it keeps blocking and a project relaxes its generated and scratchpad paths in .craft-rules.yml"
    - id: PY003
      group: Python
      text: "every public function declares its return type"
      default_severity: warn
    - id: PY004
      group: Python
      text: "no bare except - catch the exception you mean"
      default_severity: block
    - id: PY005
      group: Python
      text: "no mutable default argument - default to None and assign"
      default_severity: block
    - id: WARN-PY001
      group: Advisory
      text: "four or more parameters - consider an object"
      default_severity: warn
  builtin: ["PY001", "PY002", "PY003", "PY004", "PY005", "WARN-PY001", "NEST001", "GOD001"]

hooks:
  validators: ["hooks/python-validator.sh"]

commands:
  scaffold_types: []

agents: []

knowledge: ["knowledge/"]

templates: []
