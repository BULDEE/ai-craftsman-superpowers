name: ai-ml
version: "1.0.0"
description: "AI/ML craftsman pack - RAG pipelines, LLM integration, prompt engineering, MLOps"
compatibility:
  core: ">=2.4.0"
  stack: ["*"]

rules:
  builtin: []
  static_analysis: []

hooks:
  validators: []

commands:
  scaffold_types: []

agents: ["agents/ai-engineer.md"]

knowledge: ["knowledge/"]

# Command suggestions this pack contributes to the routing table.
routes:
  - trigger: "Design RAG pipeline, semantic search"
    command: "/craftsman:rag"
  - trigger: "Design AI agent, autonomous workflow"
    command: "/craftsman:agent-design"
  - trigger: "ML pipeline audit, production readiness"
    command: "/craftsman:mlops"
